name: Web CI

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'server/**'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install server dependencies
        run: bun install
        working-directory: server

      - name: Install web dependencies
        run: bun install
        working-directory: web

      - name: Build web
        run: bun run build
        working-directory: web